name: company-ai-research

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    container_name: company-ai-research-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-company_research}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: company-ai-research-backend
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-company_research}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Docker 네트워크에서는 localhost가 backend 자신을 가리키므로 서비스명으로 고정한다.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}

  ai-service:
    build:
      context: ./ai-service
    container_name: company-ai-research-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    env_file:
      - ./.env

volumes:
  pgdata:
