spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/company_research}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  codec:
    max-in-memory-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai-service:
  base-url: ${AI_SERVICE_URL:http://ai-service:8000}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-chars}
  expiration: 604800000

crawl:
  auto:
    cron: ${CRAWL_AUTO_CRON:0 0 1 * * *}   # 기본: 매일 새벽 1시
    stale-days: ${CRAWL_AUTO_STALE_DAYS:3}  # 기본: 3일 이상 미수집 시 갱신
