name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Spring Boot (backend)
        working-directory: backend
        run: |
          gradle bootJar --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI Service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile AI Service source
        working-directory: ai-service
        run: |
          python -m compileall app

  build-and-push-images:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image namespace (lowercase)
        id: image_ns
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "namespace=ghcr.io/$OWNER_LOWER/company-ai-research" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image_ns.outputs.namespace }}-backend:latest
            ${{ steps.image_ns.outputs.namespace }}-backend:${{ github.sha }}

      - name: Build and push ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ steps.image_ns.outputs.namespace }}-ai-service:latest
            ${{ steps.image_ns.outputs.namespace }}-ai-service:${{ github.sha }}
